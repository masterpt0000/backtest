# PostgreSQL para dados de aplicação (estratégias, jobs, parâmetros).
# Redis para filas RQ dos jobs pesados do chart.
# QuestDB continua separado (velas).
# Subir serviços app: docker compose up -d postgres redis
services:
  postgres:
    image: postgres:16-alpine
    container_name: backtest-postgres
    environment:
      POSTGRES_USER: backtest
      POSTGRES_PASSWORD: backtest
      POSTGRES_DB: backtest_app
    ports:
      - "5433:5432"
    volumes:
      - backtest_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: backtest-redis
    ports:
      - "6379:6379"
    volumes:
      - backtest_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  backtest_pg_data:
  backtest_redis_data:
